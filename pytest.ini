[pytest]
pythonpath = src
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: pure-logic tests against the reference model (no network, run anywhere)
    api: Gusto Embedded Payroll API tests (need GUSTO_API_TOKEN + GUSTO_COMPANY_ID, demo env only)
    ui: browser tests (public calculator needs no login; app tests need a saved login state)
    smoke: fast sanity subset
    case(id): links a test to a row of data/test_cases.xlsx, e.g. case("TC-PAY-074")
    known_defect(id, summary): reproduces a bug confirmed on live gusto.com; strict xfail on live runs
